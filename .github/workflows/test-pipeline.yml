name: Production CI & AI Diagnostic Pipeline

on:
  push:
    branches:
      - master
      - dev-api
      - dev-fe
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - master
      - dev-api
      - dev-fe

jobs:
  test-and-diagnose:
    name: Quality Gates & Diagnostic (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, gd, json, curl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Quality Gates & Telemetry Extraction
        id: run_tests
        run: |
          node scripts/run-project-tests.cjs

      - name: Publish AI Action Guide to GitHub Step Summary
        if: always()
        run: |
          if [ -f "reports/ai-fix-prompt.md" ]; then
            cat reports/ai-fix-prompt.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Diagnostic Telemetry Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-report-php${{ matrix.php-version }}
          path: reports/
          retention-days: 7
